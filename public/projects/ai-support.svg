<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960"><title>AI customer support concept</title><desc>Original interface preview with illustrative data.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1600" height="960" rx="0" fill="#17231e" stroke="none"/><rect x="0" y="0" width="240" height="960" rx="0" fill="#101b17" stroke="none"/><rect x="30" y="35" width="35" height="35" rx="9" fill="#79d4a1" stroke="none"/><text x="80" y="61" fill="#fff" font-size="23" font-weight="700">SUPPORT</text><text x="30" y="113" fill="#99afa2" font-size="13" font-weight="600">DEMO WORKSPACE</text><rect x="18" y="148" width="204" height="50" rx="9" fill="#ffffff16" stroke="none"/><rect x="34" y="166" width="14" height="14" rx="3" fill="#79d4a1" stroke="none"/><text x="65" y="181" fill="#fff" font-size="19" font-weight="600">Inbox</text><rect x="34" y="233" width="14" height="14" rx="3" fill="#688174" stroke="none"/><text x="65" y="248" fill="#b8c8bf" font-size="19" font-weight="400">Voice</text><rect x="34" y="300" width="14" height="14" rx="3" fill="#688174" stroke="none"/><text x="65" y="315" fill="#b8c8bf" font-size="19" font-weight="400">Knowledge</text><rect x="34" y="367" width="14" height="14" rx="3" fill="#688174" stroke="none"/><text x="65" y="382" fill="#b8c8bf" font-size="19" font-weight="400">Workflows</text><rect x="34" y="434" width="14" height="14" rx="3" fill="#688174" stroke="none"/><text x="65" y="449" fill="#b8c8bf" font-size="19" font-weight="400">Activity</text><text x="30" y="908" fill="#9cb2a5" font-size="16" font-weight="400">Seltiv / Product studio</text><rect x="240" y="0" width="1360" height="960" rx="0" fill="#17231e" stroke="none"/><rect x="240" y="0" width="1360" height="86" rx="0" fill="#1b2b23" stroke="none"/><text x="275" y="53" fill="#d7e4dc" font-size="21" font-weight="400">Customer support / Agent workspace</text><rect x="1320" y="28" width="210" height="36" rx="18" fill="#294233" stroke="none"/><text x="1336" y="52" fill="#9ee6b7" font-size="17" font-weight="600">Demo mode</text><text x="280" y="150" fill="#eff7f1" font-size="35" font-weight="600">Every conversation. One clear next step.</text><text x="280" y="192" fill="#9bb2a3" font-size="20" font-weight="400">Reply with context. Escalate with confidence.</text><rect x="280" y="230" width="350" height="660" rx="16" fill="#1c2d24" stroke="#34483b"/><text x="305" y="277" fill="#eff6f0" font-size="23" font-weight="600">Conversations</text><rect x="305" y="298" width="180" height="36" rx="18" fill="#2b4233" stroke="none"/><text x="321" y="322" fill="#a8d6b7" font-size="17" font-weight="600">All channels</text><rect x="295" y="370" width="320" height="118" rx="10" fill="#2c4836" stroke="none"/><text x="315" y="404" fill="#e5eee7" font-size="20" font-weight="600">Order enquiry</text><text x="315" y="436" fill="#a6b9ac" font-size="15" font-weight="400">Can you check my order?</text><text x="315" y="466" fill="#8ebc9c" font-size="12" font-weight="600">WEB CHAT</text><rect x="295" y="510" width="320" height="118" rx="10" fill="#203229" stroke="none"/><text x="315" y="544" fill="#e5eee7" font-size="20" font-weight="600">Delivery question</text><text x="315" y="576" fill="#a6b9ac" font-size="15" font-weight="400">Do you deliver outside Dhaka?</text><text x="315" y="606" fill="#8ebc9c" font-size="12" font-weight="600">WHATSAPP</text><rect x="295" y="650" width="320" height="118" rx="10" fill="#203229" stroke="none"/><text x="315" y="684" fill="#e5eee7" font-size="20" font-weight="600">Account help</text><text x="315" y="716" fill="#a6b9ac" font-size="15" font-weight="400">I need to update my details.</text><text x="315" y="746" fill="#8ebc9c" font-size="12" font-weight="600">VOICE</text><rect x="650" y="230" width="560" height="660" rx="16" fill="#1c2d24" stroke="#34483b"/><text x="680" y="276" fill="#f1f6f1" font-size="24" font-weight="600">Order enquiry</text><text x="680" y="309" fill="#9db4a3" font-size="15" font-weight="400">Scripted demonstration conversation</text><path d="M675 332H1185" stroke="#34483b"/><rect x="680" y="365" width="420" height="90" rx="14" fill="#2b3b31" stroke="none"/><text x="700" y="400" fill="#e8f0e9" font-size="20" font-weight="400">Hi, can you check the status of</text><text x="700" y="430" fill="#e8f0e9" font-size="20" font-weight="400">my order?</text><rect x="680" y="487" width="225" height="36" rx="18" fill="#243c2c" stroke="none"/><text x="696" y="511" fill="#8dd5a5" font-size="17" font-weight="600">ORDER LOOKUP</text><text x="680" y="555" fill="#a8bbad" font-size="17" font-weight="400">Found the order in the connected store.</text><rect x="720" y="592" width="460" height="150" rx="14" fill="#a4e2b6" stroke="none"/><text x="744" y="632" fill="#193421" font-size="21" font-weight="600">Your order is being prepared.</text><text x="744" y="669" fill="#24482f" font-size="20" font-weight="400">I can share the tracking link once</text><text x="744" y="704" fill="#24482f" font-size="20" font-weight="400">the courier has collected it.</text><rect x="680" y="800" width="500" height="58" rx="12" fill="#142219" stroke="#435c49"/><text x="702" y="836" fill="#8aa391" font-size="17" font-weight="400">Write a reply or hand off to a teammate…</text><rect x="1230" y="230" width="330" height="310" rx="16" fill="#1c2d24" stroke="#34483b"/><text x="1255" y="278" fill="#f2f7f2" font-size="23" font-weight="600">Voice support</text><rect x="1255" y="297" width="180" height="36" rx="18" fill="#2d4635" stroke="none"/><text x="1271" y="321" fill="#9bddaf" font-size="17" font-weight="600">Call preview</text><rect x="1258" y="399" width="5" height="12" rx="3" fill="#80c89b" stroke="none"/><rect x="1267" y="359.6640361484108" width="5" height="90.67192770317844" rx="3" fill="#80c89b" stroke="none"/><rect x="1276" y="396.3879498069965" width="5" height="17.224100386006988" rx="3" fill="#80c89b" stroke="none"/><rect x="1285" y="364.714686959456" width="5" height="80.570626